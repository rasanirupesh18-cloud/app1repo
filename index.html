```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Shop</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        /* Header */
        header {
            background: #222;
            color: white;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        #cartButton {
            background: white;
            color: #222;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Search */
        .search {
            text-align: center;
            padding: 25px;
        }

        .search input {
            width: 90%;
            max-width: 500px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        /* Products */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px 5%;
        }

        .product {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            margin: 12px 0 8px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .product button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .product button:hover {
            background: #0056b3;
        }

        /* Cart */
        .cart {
            position: fixed;
            right: -400px;
            top: 0;
            width: 350px;
            max-width: 90%;
            height: 100%;
            background: white;
            box-shadow: -3px 0 10px rgba(0,0,0,0.2);
            padding: 20px;
            transition: 0.3s;
            z-index: 1000;
        }

        .cart.open {
            right: 0;
        }

        .cart h2 {
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .cart-item button {
            padding: 4px 8px;
            margin: 2px;
            cursor: pointer;
        }

        .cart-total {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .checkout {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .close-cart {
            float: right;
            border: none;
            background: none;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>🛍️ Simple Shop</h1>

        <button id="cartButton">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>
    </header>

    <div class="search">
        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            onkeyup="searchProducts()"
        >
    </div>

    <main class="products" id="products"></main>

    <!-- Cart -->
    <div class="cart" id="cart">

        <button class="close-cart" onclick="closeCart()">✕</button>

        <h2>Shopping Cart</h2>

        <div id="cartItems"></div>

        <div class="cart-total">
            Total: ₹<span id="cartTotal">0</span>
        </div>

        <button class="checkout" onclick="checkout()">
            Checkout
        </button>

    </div>

    <script>

        const products = [
            {
                id: 1,
                name: "Wireless Headphones",
                price: 1499,
                image: "https://picsum.photos/400/300?random=1"
            },
            {
                id: 2,
                name: "Smart Watch",
                price: 2499,
                image: "https://picsum.photos/400/300?random=2"
            },
            {
                id: 3,
                name: "Gaming Mouse",
                price: 799,
                image: "https://picsum.photos/400/300?random=3"
            },
            {
                id: 4,
                name: "Keyboard",
                price: 1299,
                image: "https://picsum.photos/400/300?random=4"
            },
            {
                id: 5,
                name: "Bluetooth Speaker",
                price: 999,
                image: "https://picsum.photos/400/300?random=5"
            },
            {
                id: 6,
                name: "USB-C Cable",
                price: 399,
                image: "https://picsum.photos/400/300?random=6"
            }
        ];

        let cart = [];

        const productsContainer = document.getElementById("products");

        // Display products
        function displayProducts(productList = products) {

            productsContainer.innerHTML = "";

            productList.forEach(product => {

                productsContainer.innerHTML += `
                    <div class="product">

                        <img src="${product.image}" alt="${product.name}">

                        <h3>${product.name}</h3>

                        <div class="price">
                            ₹${product.price}
                        </div>

                        <button onclick="addToCart(${product.id})">
                            Add to Cart
                        </button>

                    </div>
                `;
            });
        }

        // Add product
        function addToCart(id) {

            const product = products.find(p => p.id === id);

            const existing = cart.find(item => item.id === id);

            if (existing) {
                existing.quantity++;
            } else {
                cart.push({
                    ...product,
                    quantity: 1
                });
            }

            updateCart();

        }

        // Update cart
        function updateCart() {

            const cartItems = document.getElementById("cartItems");

            cartItems.innerHTML = "";

            let total = 0;
            let count = 0;

            cart.forEach(item => {

                total += item.price * item.quantity;
                count += item.quantity;

                cartItems.innerHTML += `
                    <div class="cart-item">

                        <div>
                            <strong>${item.name}</strong>
                            <br>
                            ₹${item.price} × ${item.quantity}
                        </div>

                        <div>
                            <button onclick="changeQuantity(${item.id}, -1)">
                                -
                            </button>

                            <button onclick="changeQuantity(${item.id}, 1)">
                                +
                            </button>
                        </div>

                    </div>
                `;
            });

            document.getElementById("cartTotal").textContent = total;
            document.getElementById("cartCount").textContent = count;
        }

        // Change quantity
        function changeQuantity(id, amount) {

            const item = cart.find(item => item.id === id);

            if (!item) return;

            item.quantity += amount;

            if (item.quantity <= 0) {
                cart = cart.filter(item => item.id !== id);
            }

            updateCart();
        }

        // Search
        function searchProducts() {

            const search = document
                .getElementById("searchInput")
                .value
                .toLowerCase();

            const filtered = products.filter(product =>
                product.name.toLowerCase().includes(search)
            );

            displayProducts(filtered);
        }

        // Open cart
        document.getElementById("cartButton").onclick = function() {
            document.getElementById("cart").classList.add("open");
        };

        // Close cart
        function closeCart() {
            document.getElementById("cart").classList.remove("open");
        }

        // Checkout
        function checkout() {

            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            alert("Order placed successfully! 🎉");

            cart = [];
            updateCart();
            closeCart();
        }

        // Start app
        displayProducts();
        updateCart();

    </script>

</body>
</html>
